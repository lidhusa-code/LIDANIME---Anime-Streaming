
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIDCOMIC — Baca Komik</title>
<style>
:root{--bg:#101116;--panel:#191a22;--red:#e5484d;--text:#f5f5f7;--muted:#999ba8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{background:#191a22;padding:16px;position:sticky;top:0;z-index:5;border-bottom:1px solid #292a35}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:900;color:var(--red);letter-spacing:1px}
.logo span{color:white}
.search{flex:1;min-width:180px;background:#101116;color:white;border:1px solid #353642;padding:12px;border-radius:9px}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--red);color:white;font-weight:bold}
main{max-width:1100px;margin:auto;padding:20px 14px}
h2{font-size:20px;margin:22px 0 14px}
.hero{padding:26px;border-radius:14px;background:linear-gradient(120deg,#4a162d,#25203f 65%,#171820);margin-bottom:24px}
.hero h1{margin:0 0 10px;font-size:30px}
.hero p{color:#ddd;line-height:1.5}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters button{background:#252631}
.filters button.active{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #292a35}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#252631;display:block}
.info{padding:10px}
.info h3{font-size:14px;line-height:1.4;margin:0 0 7px}
.info p{font-size:12px;color:var(--muted);margin:0}
.tag{display:inline-block;background:#342128;color:#ffafb2;padding:4px 7px;border-radius:5px;font-size:11px;margin-top:8px}
#status{color:var(--muted);font-size:13px;margin:12px 0}
.hidden{display:none!important}
.back{background:#30313c;margin-bottom:15px}
.cover{width:130px;max-width:40%;border-radius:8px;float:left;margin:0 16px 12px 0}
.detail h1{font-size:24px}
.detail p{color:#c5c5ce;line-height:1.6}
.chapters{clear:both;padding-top:16px}
.chapter{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid #30313c;margin:6px 0;padding:13px}
.reader img{display:block;width:100%;height:auto;max-width:850px;margin:auto}
.reader{text-align:center}
.reader h2{line-height:1.4}
.reader-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}
footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero h1{font-size:36px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="top">
<div class="logo">LID<span>COMIC</span></div>
<input id="search" class="search" placeholder="Cari judul komik..." />
<button onclick="loadComics()">Cari</button>
</div></header>
<main>
<section id="home">
<div class="hero">
<h1>Dunia Komik, Satu Tempat.</h1>
<p>Temukan manga, manhwa, dan manhua favoritmu. Pilih judul, buka chapter, lalu baca langsung.</p>
<button onclick="loadComics()">Jelajahi Komik</button>
</div>
<h2>Jelajahi Katalog</h2>
<div class="filters">
<button class="active" onclick="setLang('id',this)">Indonesia</button>
<button onclick="setLang('en',this)">English</button>
<button onclick="setOrder('followedCount',this)">Populer</button>
<button onclick="setOrder('latestUploadedChapter',this)">Terbaru</button>
</div>
<div id="status">Menghubungkan ke katalog...</div>
<div id="grid" class="grid"></div>
</section>
<section id="detail" class="hidden"></section>
<section id="reader" class="hidden reader"></section>
</main>
<footer>LIDCOMIC © 2026 · Dibuat untuk pembaca komik</footer>
<script>
const API='https://api.mangadex.org';
let lang='id',order='followedCount',offset=0,loading=false;
const $=id=>document.getElementById(id);
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function titleOf(m){return m.attributes.title?.id||m.attributes.title?.en||Object.values(m.attributes.title||{})[0]||'Tanpa judul'}
function coverOf(m){let c=m.relationships?.find(r=>r.type==='cover_art');return c?.attributes?.fileName?`https://uploads.mangadex.org/covers/${m.id}/${c.attributes.fileName}.256.jpg`:''}
function show(section){['home','detail','reader'].forEach(id=>$(id).classList.toggle('hidden',id!==section));window.scrollTo(0,0)}
function setLang(v,b){lang=v;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadComics()}
function setOrder(v,b){order=v;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadComics()}
async function loadComics(){
 if(loading)return;loading=true;offset=0;$('grid').innerHTML='';$('status').textContent='Memuat katalog...';show('home');
 try{
 let q=new URLSearchParams({limit:'24',offset:'0',order:[order]+'[desc]',includes:['cover_art'],hasAvailableChapters:'true'});
 q.append('availableTranslatedLanguage[]',lang);q.append('contentRating[]','safe');q.append('contentRating[]','suggestive');
 let term=$('search').value.trim();if(term)q.set('title',term);
 let r=await fetch(API+'/manga?'+q.toString());if(!r.ok)throw Error('HTTP '+r.status);
 let data=await r.json();let list=data.data||[];
 if(!list.length&&lang==='id'&&!term){lang='en';return await loadFallback()}
 render(list);$('status').textContent=list.length?`${list.length} komik ditemukan`:'Komik tidak ditemukan. Coba bahasa English.';
 }catch(e){$('status').textContent='Katalog gagal dimuat. Periksa internet atau coba lagi.';console.error(e)}
 finally{loading=false}
}
async function loadFallback(){
 try{let q=new URLSearchParams({limit:'24',order:['followedCount']+'[desc]',includes:['cover_art'],hasAvailableChapters:'true'});q.append('availableTranslatedLanguage[]','en');q.append('contentRating[]','safe');let r=await fetch(API+'/manga?'+q);let d=await r.json();render(d.data||[]);$('status').textContent='Menampilkan komik berbahasa Inggris karena katalog Indonesia kosong.'}
 catch(e){$('status').textContent='Koneksi katalog gagal. Coba lagi nanti.'}
}
function render(list){
 $('grid').innerHTML=list.map(m=>`<article class="card" onclick="openManga('${m.id}')"><img loading="lazy" src="${esc(coverOf(m))}" alt="" onerror="this.style.visibility='hidden'"><div class="info"><h3>${esc(titleOf(m))}</h3><p>${esc(m.attributes.status||'Komik')}</p><span class="tag">Baca komik</span></div></article>`).join('');
}
async function openManga(id){
 show('detail');$('detail').innerHTML='<p>Memuat detail komik...</p>';
 try{
 let r=await fetch(API+'/manga/'+id+'?includes[]=cover_art');if(!r.ok)throw Error();let d=(await r.json()).data;
 let rel=d.relationships.find(x=>x.type==='cover_art');let cover=rel?.attributes?.fileName?`https://uploads.mangadex.org/covers/${id}/${rel.attributes.fileName}.512.jpg`:'';
 let tags=(d.attributes.tags||[]).map(t=>t.attributes.name[lang]||t.attributes.name.en).filter(Boolean).slice(0,8);
 $('detail').innerHTML=`<button class="back" onclick="show('home')">← Kembali</button><div class="detail"><img class="cover" src="${esc(cover)}"><h1>${esc(titleOf(d))}</h1><p>Status: ${esc(d.attributes.status||'-')}</p><p>${esc(d.attributes.description?.[lang]||d.attributes.description?.en||'Deskripsi belum tersedia.')}</p><p>${tags.map(esc).join(' · ')}</p></div><div class="chapters"><h2>Daftar Chapter</h2><div id="chapterList">Memuat chapter...</div></div>`;
 loadChapters(id);
 }catch(e){$('detail').innerHTML='<button class="back" onclick="show(\'home\')">← Kembali</button><p>Detail gagal dimuat. Coba lagi.</p>'}
}
async function loadChapters(id){
 try{
 let q=new URLSearchParams({limit:'100',order:['chapter']+'[desc]',includes:['scanlation_group'],translatedLanguage:[lang]});q.append('contentRating[]','safe');
 let r=await fetch(API+'/manga/'+id+'/feed?'+q);let d=await r.json();let chapters=d.data||[];
 if(!chapters.length&&lang==='id'){let q2=new URLSearchParams({limit:'100',order:['chapter']+'[desc]',translatedLanguage:['en']});q2.append('contentRating[]','safe');let r2=await fetch(API+'/manga/'+id+'/feed?'+q2);chapters=(await r2.json()).data||[]}
 $('chapterList').innerHTML=chapters.length?chapters.map(c=>`<button class="chapter" onclick="readChapter('${c.id}','${esc(c.attributes.chapter||'?')}','${esc(c.attributes.title||'')}')">Chapter ${esc(c.attributes.chapter||'?')} ${esc(c.attributes.title||'')}</button>`).join(''):'Chapter belum tersedia dalam bahasa pilihan.';
 }catch(e){$('chapterList').textContent='Gagal memuat chapter.'}
}
async function readChapter(id,num,name){
 show('reader');$('reader').innerHTML=`<button class="back" onclick="history.back();show('detail')">← Kembali ke komik</button><h2>Chapter ${esc(num)} ${esc(name)}</h2><p>Memuat halaman...</p>`;
 try{
 let r=await fetch(API+'/at-home/server/'+id);if(!r.ok)throw Error();let d=await r.json();
 let imgs=(d.chapter.data||[]).map(file=>`${d.baseUrl}/data/${d.chapter.hash}/${file}`);
 $('reader').innerHTML=`<button class="back" onclick="show('detail')">← Kembali ke komik</button><h2>Chapter ${esc(num)} ${esc(name)}</h2><div class="reader-controls"><button onclick="window.scrollTo({top:0,behavior:'smooth'})">Ke atas</button><button onclick="show('detail')">Daftar chapter</button></div>`+imgs.map((src,i)=>`<img loading="${i<3?'eager':'lazy'}" src="${esc(src)}" alt="Halaman ${i+1}">`).join('')+`<div class="reader-controls"><button onclick="show('detail')">Kembali ke chapter</button></div>`;
 }catch(e){$('reader').innerHTML='<button class="back" onclick="show(\'detail\')">← Kembali</button><p>Halaman gagal dimuat. Coba chapter lain.</p>'}
}
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')loadComics()});
loadComics();
</script>
</body>
</html>
