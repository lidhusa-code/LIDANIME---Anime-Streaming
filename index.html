
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIDANIME Player</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0913;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#151020;border-bottom:1px solid #342546}
.logo{font-size:27px;font-weight:900;color:#b99aff}
.logo span{color:white}
main{max-width:850px;margin:auto;padding:20px}
h1{font-size:24px}
p{color:#bcb4ca;line-height:1.5}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #47365d;background:#191423;color:white;margin:8px 0}
button{padding:13px 17px;border:0;border-radius:9px;background:#b99aff;color:#170e25;font-weight:bold;cursor:pointer}
.player{margin-top:22px;padding:14px;background:#171321;border-radius:14px}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:9px}
#status{font-size:13px;color:#c5b6dd}
.note{font-size:12px;color:#aaa}
</style>
</head>
<body>
<header>
  <div class="logo">LID<span>ANIME</span></div>
  <p>Tempel link video dan mulai menonton.</p>
</header>
<main>
  <h1>🎬 Streaming Player</h1>
  <label for="videoUrl">Link video langsung (MP4, WebM, atau sumber yang kompatibel)</label>
  <input id="videoUrl" type="url" placeholder="https://contoh.com/video.mp4">
  <button onclick="playVideo()">▶ PUTAR VIDEO</button>

  <div class="player">
    <video id="video" controls playsinline></video>
    <p id="status">Player siap. Tempel link video untuk mulai.</p>
  </div>

  <p class="note">Catatan: link harus menuju file video yang dapat diakses dan diizinkan untuk diputar. Link halaman biasa dari situs streaming belum tentu bisa diputar di sini.</p>
</main>
<script>
function playVideo(){
  const url=document.getElementById("videoUrl").value.trim();
  const video=document.getElementById("video");
  const status=document.getElementById("status");

  if(!url){
    status.textContent="Tempel link video dulu.";
    return;
  }

  try{
    const parsed=new URL(url);
    if(!["http:","https:"].includes(parsed.protocol)) throw new Error();
  }catch{
    status.textContent="Link tidak valid. Gunakan URL yang diawali https://";
    return;
  }

  video.pause();
  video.src=url;
  video.load();
  status.textContent="Memuat video... Kalau gagal, link mungkin bukan URL video langsung.";

  video.play().then(()=>{
    status.textContent="Video sedang diputar.";
  }).catch(()=>{
    status.textContent="Tekan tombol Play pada video. Jika tetap gagal, sumber tidak kompatibel atau akses ditolak.";
  });
}
</script>
</body>
</html>
